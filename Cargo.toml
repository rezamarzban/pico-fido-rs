[package]
edition = "2021"
name = "pico-fido-rs"
version = "0.1.0"
authors = ["sawyer bristol <sawyerbristol@gmail.com>"]

[features]
default = ["rp2040_board", "flash_2m", "usb_serial"] # official non w board, 2 MiB flash
rp2040_board = []
# Flash size of the board: enable EXACTLY ONE (build.rs writes memory.x from it; store.rs uses
# the last 12 KiB). Do not use --all-features.
flash_2m = []
flash_4m = []
flash_8m = []
flash_16m = []
# Expose the flash chip's unique ID as USB serial number (disable to avoid host-side tracking).
usb_serial = []

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.3"
embassy-embedded-hal = { version = "0.2.0", features = ["defmt"] }
embassy-sync = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.6.0", features = [
  "arch-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
  "integrated-timers",
  "nightly",
] }
embassy-time = { version = "0.3.2", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.2.0", features = [
  "defmt",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "intrinsics",
] }
embassy-futures = { version = "0.1.0" }
embassy-usb = { version = "0.3.0", features = ["defmt"] }

defmt = "0.3"
defmt-rtt = "0.4"
fixed = "1.23.1"
fixed-macro = "1.2"

panic-probe = { version = "0.3", features = ["print-defmt"] }
futures = { version = "0.3.17", default-features = false, features = [
  "async-await",
  "cfg-target-has-atomic",
  "unstable",
] }


embedded-io-async = { version = "0.6.1", features = ["defmt-03"] }
embedded-storage = { version = "0.3" }
static_cell = "2"
log = "0.4"
pio-proc = "0.2"
pio = "0.2.1"
rand = { version = "0.8.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh"] }
# PIN / ClientPIN: AES-256-CBC for the PIN protocol, Argon2id to wrap the master key
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
heapless = "0.8.0"
portable-atomic = { version = "1.7.0", features = ["critical-section"] }
embedded-alloc = "0.5.1"
once_cell = { version = "1.19.0", default-features = false, features = [
  "portable-atomic",
  "critical-section",
] }

[profile.release]
debug = 2

# p256 is far too slow unoptimised; keep deps fast even in dev builds
[profile.dev.package."*"]
opt-level = 3
