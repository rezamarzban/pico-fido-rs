[package]
name = "pico-fido-rs"
version = "0.2.0"
edition = "2021"

[features]
default = ["rp2040_board", "flash_2m", "sram_puf", "ir"]
rp2040_board = []
flash_2m = []
flash_4m = []
flash_8m = []
flash_16m = []
usb_serial = []
sram_puf = []
stack_probe = []
watchdog = []
oled = []
ir = []
guard_log = []

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.3"
embassy-embedded-hal = { version = "0.2.0", features = ["defmt"] }
embassy-sync = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.6.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "integrated-timers", "nightly"] }
embassy-time = { version = "0.3.2", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.2.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "intrinsics"] }
embassy-futures = { version = "0.1.0" }
embassy-usb = { version = "0.3.0", features = ["defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
futures = { version = "0.3.17", default-features = false, features = ["async-await", "cfg-target-has-atomic", "unstable"] }
embedded-storage = { version = "0.3" }
static_cell = "2"
rand = { version = "0.8.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
subtle = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
heapless = "0.8.0"
portable-atomic = { version = "1.7.0", features = ["critical-section"] }
embedded-alloc = "0.5.1"
once_cell = { version = "1.19.0", default-features = false, features = ["portable-atomic", "critical-section"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
