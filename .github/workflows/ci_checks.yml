name: CI Checks

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  building:
    # The firmware uses a nightly-only feature (src/main.rs), so it is built with the nightly
    # toolchain only. There is deliberately no stable firmware build.
    name: Firmware build (nightly)
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools
      - run: cargo build
      - run: cargo build --release
  host-tests:
    name: Host tests (protocol logic + end-to-end with python-fido2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fido2
      - run: sh host-test/run.sh
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools, clippy
      # no --all-features: the flash_* features are mutually exclusive
      - run: cargo clippy -- --deny=warnings
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools, rustfmt
      - run: cargo fmt -- --check
