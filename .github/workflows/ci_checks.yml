name: CI Checks

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  # The nightly OpenSK itself pins (edition 2024, let-chains). Keep in sync with rust-toolchain.toml.
  NIGHTLY: nightly-2026-06-03

jobs:
  building:
    # The firmware uses a nightly-only feature (src/main.rs), so it is built with the nightly
    # toolchain only. There is deliberately no stable firmware build.
    name: Firmware build (nightly)
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # `submodules: true` fetches third_party/OpenSK but NOT its nested submodules, which is what we want
      # (the opensk library does not use third_party/wasefire).
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools
      - run: cargo build
      - run: cargo build --release
  host-tests:
    name: Host tests (OpenSK library unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
      - run: sh host-test/run.sh
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools, clippy
      # no --all-features: the flash_* features are mutually exclusive
      - run: cargo clippy -- --deny=warnings
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools, rustfmt
      # Only our own code: `cargo fmt` does not descend into path dependencies.
      - run: cargo fmt -- --check
