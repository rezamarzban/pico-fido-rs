name: CI Checks

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  # The nightly OpenSK itself pins (edition 2024, let-chains). Keep in sync with rust-toolchain.toml.
  NIGHTLY: nightly-2026-10-02

jobs:
  building:
    # The firmware uses a nightly-only feature (src/main.rs), so it is built with the nightly
    # toolchain only. There is deliberately no stable firmware build.
    name: Firmware build (nightly)
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # OpenSK is not a git submodule of this repository (no gitlink in the tree): fetch the commit pinned
      # in third_party/OPENSK_REV. Its nested submodules are not needed (the opensk library does not use them).
      - uses: actions/checkout@v4
      - name: Fetch OpenSK (pinned commit)
        run: sh third_party/fetch-opensk.sh
      - name: Apply the OpenSK patch (one key per relying party)
        run: sh third_party/apply-opensk-patch.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools
      - name: Install flip-link (the linker, see .cargo/config.toml)
        run: cargo install flip-link --locked
      # Cargo.lock is not in the repository yet: use it (--locked) as soon as it is committed.
      - name: Locked builds when Cargo.lock exists
        shell: bash
        run: if [ -f Cargo.lock ]; then echo "LOCKED=--locked" >> "$GITHUB_ENV"; else echo "::warning::no Cargo.lock committed - build is not reproducible"; fi
      - shell: bash
        run: cargo build $LOCKED
      - shell: bash
        run: cargo build --release $LOCKED
  host-tests:
    name: Host tests (OpenSK library unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenSK (pinned commit)
        run: sh third_party/fetch-opensk.sh
      - name: Apply the OpenSK patch (one key per relying party)
        run: sh third_party/apply-opensk-patch.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
      - run: sh host-test/run.sh
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenSK (pinned commit)
        run: sh third_party/fetch-opensk.sh
      - name: Apply the OpenSK patch (one key per relying party)
        run: sh third_party/apply-opensk-patch.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools, clippy
      # no --all-features: the flash_* features are mutually exclusive
      - run: if [ -f Cargo.lock ]; then L=--locked; fi; cargo clippy $L -- --deny=warnings
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools, rustfmt
      # Only our own code: `cargo fmt` does not descend into path dependencies.
      - run: cargo fmt -- --check
