[package]
name = "host"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand = "0.8"
[profile.dev]
opt-level = 3
